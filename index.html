<script>
const COURSE_STAGE={crash:'idea',mkt:'launch',fin:'launch',ops:'growing',bd:'growing',risk:'launch',setup:'idea',inv:'scaling'};
const DOC_STAGE={customer:'idea',pricing:'launch',setup:'idea',plan:'idea',offer:'launch',amazon:'launch',shopify:'launch',etsy:'idea',tiktokshop:'launch',vibecoding:'idea','claude-tools':'idea','claude-agents':'launch'};
function stageMark(stage, named){
  const label={idea:'Idea',launch:'Launch',growing:'Growing',scaling:'Scaling'}[stage];
  if(!label) return '';
  const n={idea:1,launch:2,growing:3,scaling:4}[stage];
  const heights=[30,52,76,100];
  const bars=heights.map((h,i)=>'<i class="'+(i<n?'on':'')+'" style="height:'+h+'%"></i>').join('');
  const word=named?'<span class="stage-label">'+label+'</span>':'';
  return '<span class="stage stage-'+stage+'" aria-label="'+label+'"><span class="stage-bars" aria-hidden="true">'+bars+'</span>'+word+'</span>';
}
window.stageMark=stageMark;
window.COURSE_STAGE=COURSE_STAGE;
const courses=[['blue','🧭','Business Basics Bootcamp','Build a strong foundation across marketing, finance, operations, and legal.','6 modules · 2h 40m','68%'],['lilac','📣','Marketing That Gets Noticed','Turn your idea into a clear offer, brand, and launch plan.','4 modules · 1h 25m','34%'],['yellow','📊','Money In, Money Out','Pricing, bookkeeping, cash flow, and the numbers you need to know.','5 modules · 1h 55m','12%']];
const experts=[['AM','Alex Morgan','Small Business Strategy','Today · 2:00 PM','strategy'],['JP','Jordan Patel','Brand & Marketing','Tomorrow · 11:30 AM','marketing'],['RS','Riley Santos','Finance & Funding','Fri · 9:00 AM','finance']];
function loadSet(key){try{return new Set(JSON.parse(sessionStorage.getItem(key)||'[]'))}catch(e){return new Set()}}
function saveSet(key,set){try{sessionStorage.setItem(key,JSON.stringify([...set]))}catch(e){}}
function bookExpert(btn,name){const set=loadSet('cc-booked');set.add(name);saveSet('cc-booked',set);btn.textContent='Booked';btn.disabled=true;toast('Session reserved with '+name)}
function showBookings(){const names=[...loadSet('cc-booked')];if(!names.length){toast('No sessions booked yet');return}document.querySelectorAll('.filterbar .filter').forEach(b=>b.classList.remove('selected'));document.querySelectorAll('.expert-row').forEach(row=>{row.hidden=!names.includes(row.dataset.name)});const note=document.querySelector('.people-empty');if(note)note.hidden=true;toast(names.length===1?'1 session booked':names.length+' sessions booked')}
function filterPeople(btn,topic){btn.parentElement.querySelectorAll('.filter').forEach(b=>b.classList.toggle('selected',b===btn));const rows=[...document.querySelectorAll('.expert-row')];rows.forEach(row=>{row.hidden=topic!=='all'&&row.dataset.topic!==topic});const note=document.querySelector('.people-empty');if(note)note.hidden=rows.some(row=>!row.hidden)}

iv class="ring-label"><span class="dot"></span><strong>Learning complete</strong></div><div class="ring-label"><span class="dot gray"></span><span>${100-prog}% remaining</span></div><small style="color:var(--muted);line-height:1.35">${note}</small></div></div></article></section><section class="home-lower"><article class="panel"><h3>Your next steps</h3><p class="chart-sub">The fastest way to move forward this week.</p><div class="checklist step-cards"><button type="button" class="check step-card" onclick="route('sf/mkt/1')"><b>1</b><span><strong>Start the Marketing course</strong><br><small>SF 110 · five modules, with a value proposition and a funnel</small></span>${stageMark('launch')}</button><button type="button" class="check step-card" onclick="route('about')"><b>2</b><span><strong>Complete your business profile</strong><br><small>Help experts and investors understand what you do</small></span>${stageMark('growing')}</button><button type="button" class="check step-card" onclick="route('office')"><b>3</b><span><strong>Book a 1:1 expert session</strong><br><small>Get feedback on your next move</small></span></button></div></article><article class="chart-panel"><h3>Weekly activity</h3><p class="chart-sub">Lessons, documents, and sessions over 6 weeks.</p><div class="bar-chart"><div class="bar-col"><div class="bar soft" style="height:30%"></div><small>W1</small></div><div class="bar-col"><div class="bar soft" style="height:43%"></div><small>W2</small></div><div class="bar-col"><div class="bar soft" style="height:37%"></div><small>W3</small></div><div class="bar-col"><div class="bar" style="height:61%"></div><small>W4</small></div><div class="bar-col"><div class="bar" style="height:76%"></div><small>W5</small></div><div class="bar-col"><div class="bar" style="height:90%"></div><small>This week</small></div></div></article></section></div>`}
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey)return;if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;const root=document.querySelector('.page.reader.vol');if(!root)return;const go=e.key==='ArrowRight'?root.dataset.next:e.key==='ArrowLeft'?root.dataset.prev:'';if(!go)return;e.preventDefault();route(go)});
window.addEventListener('hashchange',()=>{render(location.hash.slice(1)||'home');setTimeout(enhanceDashboard,0);setTimeout(enhanceSupportingMaterials,0);setTimeout(cleanAbout,0);setTimeout(cleanInvestors,0);setTimeout(cleanHome,0);setTimeout(enhanceAboutProfile,0);setTimeout(enhanceLineChart,0)});render(location.hash.slice(1)||'home');setTimeout(enhanceDashboard,0);setTimeout(enhanceSupportingMaterials,0);setTimeout(cleanAbout,0);setTimeout(cleanInvestors,0);setTimeout(cleanHome,0);setTimeout(enhanceAboutProfile,0);setTimeout(enhanceLineChart,0);
</script>
