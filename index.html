.sf .cert h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:32px;letter-spacing:-1px;margin:8px 0}

<style>
.course-card{display:flex;flex-direction:column;border-radius:20px;border-color:#e3e6ed;box-shadow:0 1px 2px #1011160a;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.course-card[hidden]{display:none!important}
.course-card:hover{transform:translateY(-2px);border-color:#d3d7e0;box-shadow:0 12px 28px #1c1f2b12}
.course-card.blue{--accent:#2458f5;--wash:#e4f0ff}
.course-card.lilac{--accent:#5b4fd6;--wash:#ece8ff}
.course-card.yellow{--accent:#a16207;--wash:#fff1cc}
.course-card.mint{--accent:#0f766e;--wash:#e3f6ee}
.course-card.coral{--accent:#c2413a;--wash:#ffece9}
.course-card.dark{--accent:#334155;--wash:#e7edf4}
.course-card.sky{--accent:#0369a1;--wash:#e3f3fc}
.course-card.lav{--accent:#6d28d9;--wash:#f3ebff}
.course-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:92px;padding:18px 18px 16px;background:var(--wash);border-bottom:1px solid color-mix(in srgb,var(--accent) 14%,transparent)}
.course-mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 16%,#e6e7eb);box-shadow:0 1px 2px #1011160c;flex:none}
.course-length{font-size:12px;font-weight:600;color:#3a3f49;background:#fff;border:1px solid #e4e7ee;border-radius:999px;padding:7px 10px;line-height:1;white-space:nowrap}
.course-card .cardbody{padding:16px 20px 0;flex:1;display:flex;flex-direction:column}
.course-code{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8b919c;margin-bottom:7px}
.course-flag{letter-spacing:0;text-transform:none;font-size:11px;font-weight:700;color:var(--blue);background:var(--blue2);padding:3px 8px;border-radius:999px}
.course-card h3{font-size:18px;line-height:1.25;letter-spacing:-.35px;margin:0 0 6px}
.course-card .desc{color:#5c6370;font-size:14px;line-height:1.5;margin:0}
.course-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:14px 20px 16px;border-top:1px solid #eef0f3}
.course-status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#6a707b}
.course-status::before{content:"";width:7px;height:7px;border-radius:50%;background:#c8ccd4;flex:none}
.course-card.is-going .course-status{color:#243049}
.course-card.is-going .course-status::before{background:var(--blue)}
.course-card.is-done .course-status{color:#146c4a}
.course-card.is-done .course-status::before{background:#17865e}
.course-card .card-cta{background:#fff;color:#1a1d26;border:1px solid #d7dbe3;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;box-shadow:0 1px 1px #10111608}
.course-card .card-cta:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.course-go{margin-left:2px}
.course-bar{height:3px;background:transparent}
.course-bar span{display:block;height:100%;background:var(--accent)}
.course-card.is-idle .course-bar{display:none}
.course-card:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.lib-card .course-status::before{display:none}
.lib-card .course-status{color:#6a707b}
.lib-card .course-length{align-self:flex-end}
.section-head[hidden],.grid[hidden],.library-empty[hidden]{display:none!important}
.library-empty{color:var(--muted);margin:8px 0 0}
.page>.hero+.section-head{margin-top:4px}
.page>.materials-panel{margin-bottom:28px}
.visual.photo{padding:0;background:#d7deea}
.visual.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 22%}.visual.photo img.face-mid{object-position:center 48%}
.visual.photo .pill{z-index:1}
</style>
</head>

<script>
const courses=[['blue','🧭','Business Basics Bootcamp','Build a strong foundation across marketing, finance, operations, and legal.','6 modules · 2h 40m','68%'],['lilac','📣','Marketing That Gets Noticed','Turn your idea into a clear offer, brand, and launch plan.','4 modules · 1h 25m','34%'],['yellow','📊','Money In, Money Out','Pricing, bookkeeping, cash flow, and the numbers you need to know.','5 modules · 1h 55m','12%']];
const experts=[['AM','Alex Morgan','Small Business Strategy','Today · 2:00 PM'],['JP','Jordan Patel','Brand & Marketing','Tomorrow · 11:30 AM'],['RS','Riley Santos','Finance & Funding','Fri · 9:00 AM']];
function filterCourses(btn,topic){btn.parentElement.querySelectorAll('.filter').forEach(b=>b.classList.toggle('selected',b===btn));document.querySelectorAll('.grid .card').forEach(card=>{const topics=(card.dataset.topic||'').split(' ');card.hidden=topic!=='all'&&!topics.includes(topic)});document.querySelectorAll('.section-head').forEach(head=>{const grid=head.nextElementSibling;if(!grid||!grid.classList.contains('grid'))return;const cards=[...grid.querySelectorAll('.card')];const empty=cards.length>0&&cards.every(card=>card.hidden);head.hidden=empty;grid.hidden=empty});const note=document.querySelector('.library-empty');if(note)note.hidden=[...document.querySelectorAll('.grid .card')].some(card=>!card.hidden)}
function card(c){const ids={'Business Basics Bootcamp':'basics','Marketing That Gets Noticed':'marketing','Money In, Money Out':'money'};const topics={'Business Basics Bootcamp':'marketing finance operations legal setup','Marketing That Gets Noticed':'marketing','Money In, Money Out':'finance'};return `<article class="card" data-topic="${topics[c[2]]||''}"><div class="visual ${c[0]}"><div class="illus">${c[1]}</div><span class="pill">${c[4]}</span></div><div class="cardbody"><h3>${c[2]}</h3><p class="desc">${c[3]}</p><div class="progress"><span style="width:${c[5]}"></span></div><div class="meta"><span>${c[5]} complete</span><button class="link" onclick="route('lesson/${ids[c[2]]}')">${c[5]==='0%'?'Start':'Continue'} →</button></div></div></article>`}
function home(){return `<div class="page"><section class="hero"><div><div class="eyebrow">Good morning, Katarina</div><h1 class="title">Build the business<br>you came here to start.</h1><p class="subtitle">Your all-in-one workspace for learning the essentials, getting unstuck, and turning a campus idea into a real business.</p></div><div class="hero-actions"><button class="secondary" onclick="route('documents')">Ask the AI guide</button><button class="primary" onclick="route('learn')">Continue learning</button></div></section><div class="stats"><div class="stat"><b>3</b><span>learning paths started</span></div><div class="stat"><b>12</b><span>business documents ready</span></div><div class="stat"><b>1</b><span>expert session booked</span></div></div><section class="wide-grid"><div class="panel"><h3>Your next best steps</h3><div class="checklist step-cards"><button type="button" class="check step-card" onclick="route('sf/mkt/1')"><b>✓</b><span><strong>Start the Marketing course</strong><br><small>SF 110 · five modules, with a value proposition and a funnel</small></span></button><button type="button" class="check step-card" onclick="route('about')"><b>✓</b><span><strong>Complete your business profile</strong><br><small>Help experts and investors understand what you do</small></span></button><button type="button" class="check step-card pending" onclick="route('office')"><b>!</b><span><strong>Book a 1:1 expert session</strong><br><small>Get feedback on your next move</small></span></button></div></div><div class="panel"><h3>Jump in quickly</h3><div class="quick jump"><button type="button" class="jump-card" onclick="route('documents')"><span class="jump-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H8l-4 3V7a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/></svg></span><span class="jump-copy"><strong>Ask a question</strong><small>Get an answer from your library</small></span></button><button type="button" class="jump-card" onclick="route('learn')"><span class="jump-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg></span><span class="jump-copy"><strong>Browse documents</strong><small>Guides and templates</small></span></button><button type="button" class="jump-card" onclick="route('office')"><span class="jump-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5.5 19.5a6.5 6.5 0 0 1 13 0"/></svg></span><span class="jump-copy"><strong>Meet an expert</strong><small>Book a 30-minute session</small></span></button><button type="button" class="jump-card" onclick="route('investors')"><span class="jump-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19h16M7 14l4-4 3 3 6-6"/></svg></span><span class="jump-copy"><strong>Meet investors</strong><small>Find the right introduction</small></span></button></div></div></section><div class="section-head"><h2>Recommended for you</h2><button class="link" onclick="route('learn')">View all learning →</button></div><div class="grid">${courses.map(card).join('')}</div></div>`}
function learn(){return `<div class="page"><section class="hero"><div><div class="eyebrow">Learn by doing</div><h1 class="title">Courses and documents<br>for the business behind the idea.</h1><p class="subtitle">Learn the concepts, then use practical documents and templates to turn them into small, clear wins.</p></div><div class="hero-actions"><button class="secondary" onclick="route('documents')">Browse documents</button><button class="primary" onclick="toast('Your learning plan is ready')">My learning plan</button></div></section><div class="filterbar"><button class="filter selected">All learning</button><button class="filter">Courses</button><button class="filter" onclick="route('documents')">Documents & templates</button><button class="filter">Marketing</button><button class="filter">Finance</button><button class="filter">Operations</button><button class="filter">Legal</button></div><div class="section-head"><h2>Interactive courses</h2><button class="link" onclick="route('documents')">Go to documents →</button></div><div class="grid">${courses.map(card).join('')}<article class="card" data-topic="legal setup"><div class="visual mint"><div class="illus">🧰</div><span class="pill">3 modules · 55m</span></div><div class="cardbody"><h3>Make It Legit</h3><p class="desc">Choose a structure, register your business, and protect what you are building.</p><div class="progress"><span style="width:0"></span></div><div class="meta"><span>Not started</span><button class="link" onclick="route('lesson/legit')">Start course →</button></div></div></article><article class="card" data-topic="operations"><div class="visual coral"><div class="illus">🛡️</div><span class="pill">4 modules · 1h</span></div><div class="cardbody"><h3>Protect Your Momentum</h3><p class="desc">Understand risk, customer expectations, and the systems that keep you moving.</p><div class="progress"><span style="width:0"></span></div><div class="meta"><span>Not started</span><button class="link" onclick="route('lesson/momentum')">Start course →</button></div></div></article></div><div class="section-head"><h2>Documents and templates</h2><button class="link" onclick="route('documents')">View library →</button></div><div class="panel"><div class="quick"><button onclick="route('documents')"><span>📋</span>Marketing guides<small>Clarify your customer and offer</small></button><button onclick="route('documents')"><span>💸</span>Finance templates<small>Price, plan, and track cash flow</small></button><button onclick="route('documents')"><span>⚖️</span>Legal & setup<small>Make informed business decisions</small></button><button onclick="route('documents')"><span>✦</span>Ask the AI guide<small>Get answers from the library</small></button></div></div></div>`}
function libIcon(paths){return `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`}
function libCard(tone,icon,kind,topic,title,desc,meta,action,id,slug){return `<article class="card course-card lib-card ${tone}" data-topic="${slug}"><div class="course-top"><span class="course-mark">${libIcon(icon)}</span><span class="course-length">${kind}</span></div><div class="cardbody"><div class="course-code">${topic}</div><h3>${title}</h3><p class="desc">${desc}</p></div><div class="course-foot"><span class="course-status">${meta}</span><button class="card-cta" onclick="route('doc/${id}')">${action} <span class="course-go" aria-hidden="true">→</span></button></div></article>`}
function documents(){const docs=[
libCard('coral','<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>','Guide','Marketing','How to define your first customer','Get specific about who you help before you spend money on ads or a logo.','About 4 min','Read guide','customer','marketing'),
libCard('yellow','<path d="M20.2 13.1 12 21.3a2 2 0 0 1-2.8 0L3.4 15.5a2 2 0 0 1 0-2.8L11.6 4.5A2 2 0 0 1 13 3.9H19a2 2 0 0 1 2 2v6a2 2 0 0 1-.8 1.2z"/><circle cx="16.2" cy="7.8" r="1.15" fill="currentColor" stroke="none"/>','Guide','Finance','Pricing your first offer','A practical guide to pricing with confidence and room to grow.','About 4 min','Read guide','pricing','finance'),
libCard('lilac','<path d="M16 16.2 18.6 9l2.6 7.2a3.4 3.4 0 0 1-5.2 0z"/><path d="M2.8 16.2 5.4 9l2.6 7.2a3.4 3.4 0 0 1-5.2 0z"/><path d="M7.2 21h9.6"/><path d="M12 3v18"/><path d="M3.2 7.2h17.6"/>','Checklist','Legal','Business setup checklist','Know what to consider before you start taking customers.','4 questions','Open checklist','setup','setup')
].join('');const templates=[
libCard('blue','<rect x="7" y="3.5" width="10" height="17" rx="2"/><path d="M10 8h4M10 12h4M10 16h2.5"/>','Template','Planning','Simple business plan','A one-page plan to make your idea clear and actionable.','4 blanks','Open template','plan','foundations'),
libCard('mint','<path d="M14 3.5H7.5A1.5 1.5 0 0 0 6 5v14a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 18 19V7.5z"/><path d="M14 3.5V7.5H18"/><path d="M9 12h6M9 15.5h4"/>','Template','Offer','Offer one-pager','Say what you sell, who it is for, and what it costs on a single page.','1 page','Open template','offer','marketing')
].join('');return `<div class="page"><section class="hero"><div><div class="eyebrow">Your business library</div><h1 class="title">Guides, checklists, and templates for your business education.</h1><p class="subtitle">Read practical guides and save the templates you can use in your business.</p></div><input class="search" placeholder="⌕  Search the library" oninput="toast('Searching your library…')"></section><div class="filterbar"><button class="filter selected" onclick="filterCourses(this,'all')">All documents</button><button class="filter" onclick="filterCourses(this,'foundations')">Foundations</button><button class="filter" onclick="filterCourses(this,'marketing')">Marketing</button><button class="filter" onclick="filterCourses(this,'finance')">Finance</button><button class="filter" onclick="filterCourses(this,'operations')">Operations</button><button class="filter" onclick="filterCourses(this,'setup')">Business setup</button></div><div class="section-head" id="library-documents"><h2>Documents</h2></div><div class="grid">${docs}</div><div class="section-head" id="library-templates"><h2>Templates</h2></div><div class="grid">${templates}</div><p class="library-empty" hidden>No documents in this topic yet.</p></div>`}

function enhanceSupportingMaterials(){const page=location.hash.slice(1)||'home';if(page!=='office'&&page!=='investors')return;if(document.querySelector('.materials-panel'))return;const target=document.querySelector('.page');if(!target)return;const isInvestor=page==='investors';const icon=paths=>`<div class="material-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg></div>`;const doc=icon('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/>');const chart=icon('<path d="M4 19V5M4 19h16M8 16v-4M12 16V8M16 16v-6"/>');const funds=icon('<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M7 10h.01M17 14h.01"/>');const ask=icon('<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.2 1.8c0 1.4-1.2 1.8-2.2 2.4-.4.2-.5.5-.5.8M12 17h.01"/>');const link=icon('<path d="M10 13a5 5 0 0 0 7.54.54l2-2a5 5 0 0 0-7.07-7.07L11.2 5.7"/><path d="M14 11a5 5 0 0 0-7.54-.54l-2 2a5 5 0 0 0 7.07 7.07l1.27-1.27"/>');const cards=isInvestor?[[doc,'Business snapshot','What you do, who you serve, and why now.'],[chart,'Traction & metrics','Sales, customers, reviews, or progress so far.'],[funds,'Funding plan','How much you need and what it will unlock.']]:[[ask,'One clear question','The decision or challenge you want to work through.'],[link,'A draft or link','Bring your offer, profile, plan, or marketing copy.'],[chart,'Relevant numbers','Pricing, sales, costs, or customer feedback.']];const items=cards.map(([mark,title,copy])=>'<div class="material">'+mark+'<strong>'+title+'</strong><small>'+copy+'</small></div>').join('');const html=`<section class="materials-panel${isInvestor?' under-profile':''}"><h3>Recommended supporting materials</h3><p>${isInvestor?'Prepare these before requesting an investor or funding connection.':'Bring these materials so your expert can give more specific, useful feedback.'}</p><div class="materials-grid">${items}</div><a class="materials-link" href="#documents">Find templates in Learn</a></section>`;if(isInvestor){const profile=[...target.querySelectorAll('.panel')].find(panel=>panel.textContent.includes('Your founder profile'));if(profile){profile.insertAdjacentHTML('afterend',html);return}}const spot=target.querySelector('.stats');(spot||target).insertAdjacentHTML(spot?'afterend':'beforeend',html)}
function cleanAbout(){if((location.hash.slice(1)||'home')!=='about')return;const page=document.querySelector('.page');if(!page)return;const profile=page.querySelector('.panel');if(profile)profile.classList.add('about-profile');page.querySelector('.hero .primary')?.remove();page.querySelector('.panel .tag')?.remove();page.querySelector('.row .link')?.remove();const stats=page.querySelector('.stats');if(!stats||stats.classList.contains('about-analytics'))return;const cards=[...stats.children];if(cards.length<4)return;stats.className='stats about-analytics';stats.innerHTML='';stats.append(cards[0],cards[1],cards[2],cards[3]);stats.insertAdjacentHTML('beforeend',`<div class="about-chart"><h3>Store performance</h3><p>Daily activity over the last 7 days</p><div class="mini-chart"><div class="mini-bar" style="height:42%"></div><div class="mini-bar" style="height:58%"></div><div class="mini-bar" style="height:48%"></div><div class="mini-bar" style="height:72%"></div><div class="mini-bar" style="height:66%"></div><div class="mini-bar" style="height:84%"></div><div class="mini-bar current" style="height:100%"></div></div></div>`)}
function cleanInvestors(){if((location.hash.slice(1)||'home')!=='investors')return;document.querySelector('.page .hero .primary')?.remove()}
function cleanHome(){if((location.hash.slice(1)||'home')!=='home')return;document.querySelector('.page > .hero .subtitle')?.remove()}
function enhanceAboutProfile(){if((location.hash.slice(1)||'home')!=='about')return;const profile=document.querySelector('.page > .panel');if(!profile)return;profile.classList.add('about-profile')}
function enhanceLineChart(){if((location.hash.slice(1)||'home')!=='about')return;const chart=document.querySelector('.about-chart .mini-chart');if(!chart||chart.dataset.lineReady)return;chart.dataset.lineReady='true';chart.innerHTML=`<svg class="line-chart" viewBox="0 0 520 112" role="img" aria-label="Store performance trend over the last seven days"><line class="gridline" x1="24" y1="18" x2="500" y2="18"></line><line class="gridline" x1="24" y1="48" x2="500" y2="48"></line><line class="gridline" x1="24" y1="78" x2="500" y2="78"></line><line class="gridline" x1="24" y1="98" x2="500" y2="98"></line><polyline class="trend" points="24,68 104,78 184,54 264,64 344,34 424,48 500,22"></polyline><circle class="point" cx="500" cy="22" r="5"></circle><text class="latest-label" x="460" y="14">Today</text><text x="20" y="110">Mon</text><text x="174" y="110">Wed</text><text x="330" y="110">Fri</text><text x="480" y="110">Sun</text></svg>`}
function home(){const r=(window.SF&&SF.resume())||{href:'sf/crash',title:'Business Crash Course',detail:'SF 101 · 8 modules · 3.5 hours',pct:0,action:'Start →',kicker:'Start here'};const prog=window.SF?SF.overall():0;const going=window.SF?SF.started():0;const note=prog===0?'You have not started a course yet.':prog===100?'Every Startup Foundations course is complete.':'You are '+prog+'% through Startup Foundations.';const bits=String(r.detail).split(' · ');const code=bits[0]||'';const status=r.pct<=0?'Not started':r.pct>=100?'Complete':r.pct+'% complete';const meta=bits.map(part=>'<span>'+part+'</span>').join('');return `<div class="page home-layout"><section class="hero"><div><div class="eyebrow">Good morning, Katarina</div><h1 class="title">Build the business<br>you came here to start.</h1></div></section><div class="stat-pills"><span class="stat-pill"><b>${going}</b> courses in progress</span><span class="stat-pill"><b>12</b> documents ready</span><span class="stat-pill"><b>1</b> expert session booked</span></div><section class="home-hero-grid"><article class="continue-card"><div class="continue-head"><div><div class="continue-kicker">${r.kicker}</div><h2>${r.title}</h2><p class="continue-meta">${meta}</p></div><div class="continue-mark" aria-hidden="true">${code.replace(' ','<br>')}</div></div><div class="continue-foot"><div class="continue-track"><div class="continue-status"><span>${status}</span><b>${r.pct}%</b></div><div class="progress"><span style="width:${r.pct}%"></span></div></div><button class="resume" onclick="route('${r.href}')">${r.action}</button></div></article><article class="panel launch-card"><h3>Course progress</h3><p class="chart-sub">How far you are through the courses</p><div class="ring-row"><div class="ring" style="background:conic-gradient(var(--blue) 0 ${prog}%,#edf0f4 ${prog}% 100%)"><span class="ring-value">${prog}%</span></div><div class="ring-labels"><div class="ring-label"><span class="dot"></span><strong>Learning complete</strong></div><div class="ring-label"><span class="dot gray"></span><span>${100-prog}% remaining</span></div><small style="color:var(--muted);line-height:1.35">${note}</small></div></div></article></section><section class="home-lower"><article class="panel"><h3>Your next steps</h3><p class="chart-sub">The fastest way to move forward this week.</p><div class="checklist step-cards"><button type="button" class="check step-card" onclick="route('sf/mkt/1')"><b>✓</b><span><strong>Start the Marketing course</strong><br><small>SF 110 · five modules, with a value proposition and a funnel</small></span></button><button type="button" class="check step-card" onclick="route('about')"><b>✓</b><span><strong>Complete your business profile</strong><br><small>Help experts and investors understand what you do</small></span></button><button type="button" class="check step-card pending" onclick="route('office')"><b>!</b><span><strong>Book a 1:1 expert session</strong><br><small>Get feedback on your next move</small></span></button></div></article><article class="chart-panel"><h3>Weekly activity</h3><p class="chart-sub">Lessons, documents, and sessions over 6 weeks.</p><div class="bar-chart"><div class="bar-col"><div class="bar soft" style="height:30%"></div><small>W1</small></div><div class="bar-col"><div class="bar soft" style="height:43%"></div><small>W2</small></div><div class="bar-col"><div class="bar soft" style="height:37%"></div><small>W3</small></div><div class="bar-col"><div class="bar" style="height:61%"></div><small>W4</small></div><div class="bar-col"><div class="bar" style="height:76%"></div><small>W5</small></div><div class="bar-col"><div class="bar" style="height:90%"></div><small>This week</small></div></div></article></section></div>`}
window.addEventListener('hashchange',()=>{render(location.hash.slice(1)||'home');setTimeout(enhanceDashboard,0);setTimeout(enhanceSupportingMaterials,0);setTimeout(cleanAbout,0);setTimeout(cleanInvestors,0);setTimeout(cleanHome,0);setTimeout(enhanceAboutProfile,0);setTimeout(enhanceLineChart,0)});render(location.hash.slice(1)||'home');setTimeout(enhanceDashboard,0);setTimeout(enhanceSupportingMaterials,0);setTimeout(cleanAbout,0);setTimeout(cleanInvestors,0);setTimeout(cleanHome,0);setTimeout(enhanceAboutProfile,0);setTimeout(enhanceLineChart,0);
</script>
